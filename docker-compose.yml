# Full stack: gateway -> NGINX -> vLLM, scraped by Prometheus, shown in Grafana.
# Ports are bound to 127.0.0.1 only. From your laptop, reach them over SSH:
#   ssh -L 8080:localhost:8080 -L 3000:localhost:3000 -L 9090:localhost:9090 <gpu-box>

name: llm-inference-ops

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    entrypoint: ["vllm", "serve"]
    command:
      - ${MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-llm}
      - --config
      - /configs/${VLLM_CONFIG:-baseline}.yaml
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./vllm/configs:/configs:ro
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    ipc: host
    # Published on localhost only, so scripts on the box can read vLLM's /metrics directly.
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      # First start downloads the model weights (~15 GB).
      start_period: 15m
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vllm
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      UPSTREAM_URL: http://nginx:80
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - nginx
    restart: unless-stopped

  # GPU utilization, memory, temperature and power, read from nvidia-smi.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.15.1
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

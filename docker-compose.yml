# Full stack: gateway -> NGINX -> vLLM, scraped by Prometheus, shown in Grafana.
# Ports are bound to 127.0.0.1 only. From your laptop, reach them over SSH:
#   ssh -L 8080:localhost:8080 -L 3000:localhost:3000 -L 9090:localhost:9090 -L 16686:localhost:16686 <gpu-box>

name: llm-inference-ops

services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    entrypoint: ["vllm", "serve"]
    command:
      - ${MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      - --served-model-name
      - ${SERVED_MODEL_NAME:-llm}
      - --config
      - /configs/${VLLM_CONFIG:-baseline}.yaml
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      OTEL_SERVICE_NAME: vllm
    volumes:
      - ./vllm/configs:/configs:ro
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
      # Where the PyTorch profiler writes traces (only with the profile_* configs).
      - ./results/profiles:/profiles
    ipc: host
    # Published on localhost only, so scripts on the box can read vLLM's /metrics directly.
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      # First start downloads the model weights (~15 GB).
      start_period: 15m
    restart: unless-stopped

  nginx:
    # Same NGINX, built with the OpenTelemetry module.
    image: nginx:1.27-alpine-otel
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - vllm
      - jaeger
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      UPSTREAM_URL: http://nginx:80
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: gateway
      # Harness limits (gateway/app/config.py). Turn them all off with HARNESSES_ENABLED=false.
      HARNESSES_ENABLED: ${HARNESSES_ENABLED:-true}
      MAX_PROMPT_TOKENS: ${MAX_PROMPT_TOKENS:-6000}
      MAX_OUTPUT_TOKENS: ${MAX_OUTPUT_TOKENS:-1024}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-60}
      RATE_LIMIT_TPM: ${RATE_LIMIT_TPM:-200000}
      MAX_IN_FLIGHT: ${MAX_IN_FLIGHT:-256}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - nginx
      - jaeger
    restart: unless-stopped

  # GPU utilization, memory, temperature and power, read from nvidia-smi.
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.15.1
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # Load generator (Phase 4). Not started with the stack; run it with:
  #   docker compose --profile loadtest run --rm -p 127.0.0.1:8089:8089 locust
  locust:
    image: locustio/locust:2.46.6
    profiles: ["loadtest"]
    user: "0"  # write results into the mounted folder
    environment:
      GATEWAY_URL: http://gateway:8080
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-llm}
      RESULTS_DIR: /results
      LOAD_STEPS: ${LOAD_STEPS:-1,2,4,8,16,32,64,96,128,192,256,384,512}
      STEP_SECONDS: ${STEP_SECONDS:-60}
    volumes:
      - ./loadtest:/mnt/loadtest:ro
      - ./results/${LOAD_PHASE:-04_breaking_one_gpu}/${RUN_LABEL:-baseline}:/results
    command: ["-f", "/mnt/loadtest/locustfile.py", "--autostart", "--autoquit", "5",
              "--processes", "${LOCUST_PROCESSES:-8}", "--web-port", "8089",
              "--html", "/results/locust_report.html", "--csv", "/results/locust"]
    depends_on:
      - gateway

  # Traces from the agent, gateway, NGINX and vLLM. UI on :16686.
  jaeger:
    image: jaegertracing/jaeger:2.21.0
    ports:
      - "127.0.0.1:16686:16686"
      # OTLP, so scripts on the box (the agent) can send traces too.
      - "127.0.0.1:4317:4317"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

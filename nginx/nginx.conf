# Load balancer in front of vLLM. One upstream for now; Phase 6 adds more
# servers to the same upstream block.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # rid = gateway request ID, rt = total time in NGINX, urt = time waiting on vLLM
    log_format timed '$remote_addr "$request" $status rid=$http_x_request_id '
                     'rt=$request_time urt=$upstream_response_time upstream=$upstream_addr';
    access_log /dev/stdout timed;

    upstream vllm_backends {
        server vllm:8000;
        keepalive 64;
    }

    server {
        listen 80;

        location /v1/ {
            proxy_pass http://vllm_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;

            # Stream tokens as they are generated instead of buffering the response.
            proxy_buffering off;
            proxy_cache off;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 10m;
        }

        location = /health {
            proxy_pass http://vllm_backends/health;
        }

        location = /nginx_status {
            stub_status;
        }
    }
}

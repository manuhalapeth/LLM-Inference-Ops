# Load balancer in front of vLLM. The list of vLLM servers and the balancing
# method live in an included file (nginx/upstream_single.conf by default;
# scripts/topology.py writes one for each multi-GPU setup).

# OpenTelemetry: NGINX continues the gateway's trace and passes it on to vLLM.
load_module modules/ngx_otel_module.so;

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    otel_exporter {
        endpoint jaeger:4317;
    }
    otel_service_name nginx;
    otel_trace on;
    # rid = gateway request ID, run = agent run ID, rt = total time in NGINX,
    # uct/uht/urt = time to connect to / get headers from / finish with vLLM
    log_format timed '$remote_addr "$request" $status rid=$http_x_request_id run=$http_x_run_id '
                     'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time '
                     'urt=$upstream_response_time upstream=$upstream_addr trace=$otel_trace_id';
    access_log /dev/stdout timed;

    # Docker's internal DNS. With "resolve", NGINX looks vLLM's address up again
    # every few seconds, so a restarted vLLM container is found without restarting NGINX.
    resolver 127.0.0.11 valid=5s ipv6=off;

    include /etc/nginx/upstream.conf;

    server {
        listen 80;

        location /v1/ {
            # Join the incoming trace and send traceparent on to vLLM.
            otel_trace_context propagate;
            otel_span_name "nginx $request_method $uri";
            proxy_pass http://vllm_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Run-ID $http_x_run_id;

            # Stream tokens as they are generated instead of buffering the response.
            proxy_buffering off;
            proxy_cache off;

            # Fail fast if a vLLM server is down, instead of waiting the default 60 s,
            # and try the next server if a request couldn't be sent to this one.
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 10m;
        }

        location = /health {
            otel_trace off;
            proxy_pass http://vllm_backends/health;
        }

        location = /nginx_status {
            otel_trace off;
            stub_status;
        }
    }
}

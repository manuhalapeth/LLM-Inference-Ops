# Phase 11: FP8 weights, FP8 KV cache at scale 1.0, FlashInfer with its native
# decode kernel instead of TensorRT LLM's XQA kernel (vLLM's default on this GPU).
host: 0.0.0.0
port: 8000
gpu-memory-utilization: 0.90
max-model-len: 8192
quantization: fp8
kv-cache-dtype: fp8
attention-config:
  use_trtllm_attention: false

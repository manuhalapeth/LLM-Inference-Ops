# Phase 6 disaggregated serving: the DECODE server. Receives the KV from a prefill
# server through Mooncake and generates the answer.
host: 0.0.0.0
port: 8000
gpu-memory-utilization: 0.90
max-model-len: 8192
quantization: fp8
kv-transfer-config:
  kv_connector: MooncakeConnector
  kv_role: kv_consumer
  kv_connector_extra_config:
    mooncake_protocol: tcp

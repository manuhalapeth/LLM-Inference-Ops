global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # vLLM servers come from a file, so a multi-GPU setup can list all of them
  # (observability/prometheus/targets/vllm.json by default).
  - job_name: vllm
    file_sd_configs:
      - files: ["/etc/prometheus/targets/vllm.json"]
        refresh_interval: 10s

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

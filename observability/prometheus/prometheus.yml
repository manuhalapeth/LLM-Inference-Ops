global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
